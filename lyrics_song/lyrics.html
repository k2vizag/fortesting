<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:TE9;src:url(../insurance/v2/fonts/TeluguCap900.ttf)}
@font-face{font-family:PX;src:url(../insurance/v2/fonts/PopX.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
*{box-sizing:border-box}
/* background: blurred copy of the current photo */
.bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(40px) brightness(.55) saturate(1.25);opacity:0}
/* the photo box: whole photo, never cropped */
.box{position:absolute;border-radius:34px;overflow:hidden;opacity:0;
  box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 3px rgba(255,214,120,.75),0 0 40px rgba(255,190,90,.25)}
.box img{display:block;width:100%;height:100%}
#fx{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 75% at 50% 55%,rgba(0,0,0,0) 60%,rgba(0,0,0,.45) 100%)}
#card{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;max-width:980px;top:80px;border-radius:30px;padding:16px 36px 18px;
  background:rgba(10,8,20,.42);backdrop-filter:blur(14px);
  box-shadow:0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.18);border:1.5px solid rgba(255,215,120,.35)}
#bar{position:absolute;left:50%;top:-3px;width:160px;height:6px;margin-left:-80px;border-radius:3px;background:linear-gradient(90deg,#FFB020,#FF5E7E)}
#cur{display:flex;flex-wrap:nowrap;justify-content:center;column-gap:.28em;line-height:1.32;transform-origin:50% 50%}
#cur .w{display:inline-block;color:transparent;-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.45)) drop-shadow(0 0 12px rgba(0,0,0,.5));white-space:nowrap;padding:0 2px}
.te #cur{font-family:TE9;font-size:64px}
.en #cur{font-family:PX;font-size:54px}
</style></head><body>
<div id="bgs"></div><div id="vig"></div><canvas id="fx" width="1080" height="1920"></canvas><div id="boxes"></div>
<div id="card"><div id="bar"></div><div id="cur"></div></div>
<script>
const D=window.__DATA__; document.body.className=D.font;
const $=id=>document.getElementById(id);
const clamp=x=>Math.max(0,Math.min(1,x)), lerp=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};               // smoothstep
const eBack=x=>{const c=1.7;x=clamp(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// photo box area (below the lyric card)
const AX0=60, AX1=1020, AY0=260, AY1=1860;
const S=D.shots.map(s=>{
  const bg=document.createElement('div');bg.className='bg';bg.style.backgroundImage=`url(${s.src})`;$('bgs').appendChild(bg);
  const a=s.w/s.h, W0=AX1-AX0, H0=AY1-AY0; let w=W0,h=W0/a; if(h>H0){h=H0;w=H0*a}
  const box=document.createElement('div');box.className='box';
  box.style.width=w+'px';box.style.height=h+'px';box.style.left=(540-w/2)+'px';box.style.top=((AY0+AY1)/2-h/2)+'px';
  const im=document.createElement('img');im.src=s.src;box.appendChild(im);$('boxes').appendChild(box);
  return {...s,bg,box}});
const XF=0.7;   // crossfade length
function shotAt(t){let i=0;for(let k=0;k<S.length;k++) if(t>=S[k].a) i=k; return i}
function show(s,o,t,enter){
  // smooth zoom of the whole box (photo is never cropped): 0.95 -> 1.0 over the shot
  const p=clamp((t-s.a+XF/2)/(s.b-s.a+XF)), z=lerp(0.95,1.0,sm(p));
  const ez=enter===undefined?0:enter;   // extra for entering/leaving
  s.box.style.opacity=o; s.box.style.transform=`translateY(${ez*30}px) scale(${z-ez*0.03})`;
  s.bg.style.opacity=o; s.bg.style.transform=`scale(${1.05+0.06*p})`;}
// soft golden sparkles
const cv=$('fx'),cx=cv.getContext('2d'); let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=[...Array(55)].map(()=>({x:rnd()*1080,y:rnd()*2100,r:2+rnd()*6,v:25+rnd()*50,ph:rnd()*6.3,w:20+rnd()*40}));
function particles(t,amt){cx.clearRect(0,0,1080,1920);
  for(const p of P){const y=((p.y-p.v*t)%2100+2100)%2100-90, x=p.x+Math.sin(t*0.6+p.ph)*p.w;
    const a=amt*(0.4+0.6*Math.sin(t*2.6+p.ph*2)**2);
    const g=cx.createRadialGradient(x,y,0,x,y,p.r*3);g.addColorStop(0,`rgba(255,246,210,${a})`);g.addColorStop(.4,`rgba(255,200,90,${a*.5})`);g.addColorStop(1,'rgba(255,180,60,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(x,y,p.r*3,0,6.3);cx.fill();}}
// lyrics
let LI=-2, WORDS=[];
function setLine(i){LI=i;const L=D.lines[i];const c=$('cur');c.innerHTML='';WORDS=[];
  if(L){const ws=L.t.split(' ');const tot=ws.reduce((s,w)=>s+w.length,0);let acc=0;
    ws.forEach(w=>{const sp=document.createElement('span');sp.className='w';sp.textContent=w;c.appendChild(sp);
      WORDS.push({sp,f0:acc/tot,f1:(acc+w.length)/tot});acc+=w.length;});}
  c.style.transform='';const ov=c.scrollWidth/(980-72); c.dataset.s=ov>1?1/ov:1;}
function render(t){
  const i=shotAt(t), s=S[i], n=S[i+1];
  S.forEach(x=>{x.box.style.opacity=0;x.bg.style.opacity=0});
  if(n && t>n.a-XF){const k=sm((t-(n.a-XF))/XF); show(s,1-k,t,-k*0.0); s.box.style.opacity=1-k; show(n,k,t,1-k);
    s.box.style.opacity=1-k; s.bg.style.opacity=1-k;}
  else show(s,1,t);
  particles(t, s.her?0.55:0.3);
  let li=-1; for(let k=0;k<D.lines.length;k++) if(t>=D.lines[k].a-0.12) li=k;
  if(li!==LI) setLine(li);
  const L=D.lines[li], c=$('cur');
  $('card').style.opacity=Math.min(clamp(t/0.5), clamp((D.total-t)/0.6));
  if(L){const lt=t-(L.a-0.12), p=clamp((t-L.a)/(L.b-L.a-0.15));
    WORDS.forEach((w,k)=>{const d=lt-k*0.06, a=eBack(d/0.35);
      const f=clamp((p-w.f0)/Math.max(w.f1-w.f0,1e-3))*100;
      w.sp.style.backgroundImage=`linear-gradient(90deg,#FFE45C 0%,#FFB020 ${Math.max(f-6,0)}%,#FF8A00 ${f}%,#ffffff ${Math.min(f+0.01,100)}%,#ffffff 100%)`;
      w.sp.style.opacity=clamp(d/0.2); w.sp.style.transform=`translateY(${(1-clamp(a))*18}px) scale(${0.8+0.2*a})`;});
    c.style.transform=`scale(${c.dataset.s})`;}
  const g=Math.min(clamp(t/0.5),clamp((D.total-t)/0.7));
  $('boxes').style.opacity=g; $('bgs').style.opacity=g;
}
window.render=render;
window.__ready=Promise.all([document.fonts.ready,...[...document.images].map(im=>im.decode().catch(()=>0))]).then(()=>true);
</script></body></html>
