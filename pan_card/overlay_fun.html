<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:TE8;src:url(../fonts/TeluguCap800.ttf)}
@font-face{font-family:TE9;src:url(../fonts/TeluguCap900.ttf)}
@font-face{font-family:PX;src:url(../fonts/PopX.ttf)}
@font-face{font-family:PB;src:url(../fonts/PopB.ttf)}
@font-face{font-family:RAMA;src:url(../fonts/RamaCap.ttf)}
html,body{margin:0;padding:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
.abs{position:absolute}
#root{position:absolute;inset:0}
/* captions */
.cap{position:absolute;left:0;right:0;top:1545px;display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none}
.cw{font-family:PB,TE8;font-weight:700;font-size:62px;color:#fff;line-height:1.25;
  text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.65),0 0 3px rgba(0,0,0,.9);white-space:nowrap}
.ch{font-family:PX,TE9;font-size:118px;line-height:1.12;white-space:nowrap;padding:6px 24px 40px;margin:-6px 0 -40px;
  background:linear-gradient(180deg,#FFF06A 0%,#FFC21A 45%,#FF7A00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(60,20,0,.55)) drop-shadow(0 0 22px rgba(0,0,0,.55))}
.ch.g{background:linear-gradient(180deg,#E9FF8A 0%,#7CF05A 50%,#19B24A 100%);-webkit-background-clip:text;background-clip:text}
.cs{font-family:PB,TE8;font-style:italic;font-size:50px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 14px rgba(0,0,0,.7);white-space:nowrap}
/* stickers */
.stk{position:absolute;width:150px;display:flex;flex-direction:column;align-items:center}
.stk .ic{width:124px;height:124px;border-radius:32px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 30px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.35)}
.stk .ic svg{width:70px;height:70px}
.stk .lb{margin-top:10px;font-family:PB,TE8;font-size:30px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.9);white-space:nowrap}
.num{position:absolute;left:34px;top:1150px;font-family:PX;font-style:italic;font-size:250px;color:#fff;
  text-shadow:0 10px 0 rgba(0,0,0,.35),0 0 30px rgba(0,0,0,.5);transform-origin:50% 60%}
/* cards */
.card{position:absolute;inset:0;overflow:hidden}
.dark{background:radial-gradient(circle at 50% 30%,#1a2150 0%,#0b1030 55%,#060819 100%)}
.dark .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.045) 2px,transparent 2px);background-size:90px 90px}
.white{background:radial-gradient(circle at 50% 25%,#ffffff 0%,#f3f4fa 60%,#e9ebf5 100%)}
.kick{font-family:PB,TE8;letter-spacing:6px;font-size:34px;color:#8b93b5;text-align:center;position:absolute;left:0;right:0}
.white .kick{color:#7d8294}
.pill{display:inline-block;padding:10px 38px 14px;border-radius:22px;font-family:PX,TE9;font-size:62px;color:#fff;
  background:linear-gradient(180deg,#7B6CFF,#4B3BE0);box-shadow:0 10px 26px rgba(75,59,224,.45), inset 0 2px 0 rgba(255,255,255,.35)}
.tile{width:150px;height:150px;border-radius:38px;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 34px rgba(30,40,90,.16)}
.tile svg{width:76px;height:76px}
/* timeline */
.tl-line{position:absolute;left:170px;width:6px;border-radius:3px;background:#2a3266}
.tl-fill{position:absolute;left:170px;width:6px;border-radius:3px;background:linear-gradient(#FFB020,#FF6A00)}
.tl-node{position:absolute;left:146px;width:54px;height:54px;border-radius:50%;background:#2a3266;display:flex;align-items:center;justify-content:center}
.tl-node svg{width:30px;height:30px}
.tl-step{position:absolute;left:250px;right:40px}
.tl-v{font-family:PX,TE9;font-size:92px;line-height:1;color:#FFB020}
.tl-t{font-family:PB,TE8;font-size:52px;color:#fff;margin-top:8px}
.tl-s{font-family:PB,TE8;font-size:34px;color:#8b93b5;margin-top:4px}
/* terminal */
.term{position:absolute;left:60px;right:60px;top:300px;height:1060px;border:3px solid #1f6b35;border-radius:28px;background:#020a04;
  box-shadow:0 0 60px rgba(40,255,110,.12) inset}
.term .hd{font-family:"DejaVu Sans Mono",monospace;font-weight:bold;color:#3BFF7A;font-size:34px;letter-spacing:4px;margin:44px 50px 30px}
.term .ln{font-family:"DejaVu Sans Mono",TE8,monospace;color:#3BFF7A;font-size:50px;margin:22px 50px;text-shadow:0 0 12px rgba(59,255,122,.55);white-space:nowrap}
.cursor{display:inline-block;width:26px;height:50px;background:#3BFF7A;vertical-align:-8px;margin-left:6px}
/* board */
.board{position:absolute;width:330px;height:150px;border-radius:24px;background:#D8302B;box-shadow:6px 10px 18px rgba(0,0,0,.45)}
.board .in{position:absolute;inset:9px;border-radius:17px;background:#F5D90A;display:flex;flex-direction:column;align-items:center;justify-content:center}
.board .t1{font-family:RAMA;font-size:44px;color:#D8302B;line-height:1}
.board .t2{font-family:PX;font-size:46px;color:#111;line-height:1.15;letter-spacing:1px}
.ttl{position:absolute;left:0;right:0;display:flex;justify-content:center;z-index:45}
.ttl span{display:inline-block;font-family:PX;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.35)}
/* end */
.btn{position:absolute;height:96px;border-radius:48px;display:flex;align-items:center;justify-content:center;font-family:PX;font-size:44px;color:#fff}
</style></head>
<body><div id="root"></div>
<script>
const D = window.__DATA__;
const root = document.getElementById('root');
const ICON = {
 shield:'<path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
 bike:'<circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5L9 10h5l4.5 6.5M12 10l-1.5-3H7.5M14 10l2-3h3"/>',
 car:'<path d="M3 13l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v4h-2M5 17H3v-4M9 17h6M3 13h18"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
 rupee:'<path d="M7 4h10M7 8h10M8 4c6.5 0 6.5 8 0 8H7l7.5 8"/>',
 doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
 gauge:'<path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 15l4-5"/><circle cx="12" cy="16" r="1.4"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
 wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 plus:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
 up:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
 down:'<path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 road:'<path d="M8 3L4 21M16 3l4 18M12 5v3M12 11v3M12 17v3"/>',
 star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>',
 phone:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',
 otp:'<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12h.01M10.5 12h.01M14 12h.01M17.5 12h.01"/>',
 idc:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M6 16c.5-1.5 1.5-2 2.5-2s2 .5 2.5 2M14 10h4M14 13h4"/>',
 pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>',
 eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
};
const svg=(n,c='#fff',w=2.2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]||''}</svg>`;
const GR = {blue:['#4FA3FF','#1E5BFF'],green:['#3BE38A','#0E9F5A'],orange:['#FFB347','#FF5E1A'],purple:['#B07CFF','#6A3BFF'],
            pink:['#FF7EB3','#E8336D'],teal:['#3EE6E0','#0B9BB0'],red:['#FF6B6B','#D62839'],yellow:['#FFE259','#FFA751']};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOut=x=>1-Math.pow(1-clamp(x),3);
const eBack=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function el(html,parent=root){const d=document.createElement('div');d.innerHTML=html.trim();const n=d.firstChild;parent.appendChild(n);return n}
function fit(node,maxw){node.style.transform='';const w=node.scrollWidth;if(w>maxw){const s=maxw/w;node.dataset.fit=s}else node.dataset.fit=1}

// ---------------- build: cards (lowest), then stickers/captions, board, end
const items=[];
function BUILD_profile(ctx){const {c,n}=ctx;
  const g=GR[c.color||'purple'];
  ctx.parts.av=el(`<div class="abs" style="left:390px;top:260px;width:300px;height:300px;border-radius:50%;padding:12px;background:linear-gradient(135deg,${g[0]},${g[1]});box-shadow:0 20px 50px rgba(60,40,160,.3)">
     <div style="width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center">${svg(c.icon,g[1],2)}</div></div>`,n);
  ctx.parts.av.firstElementChild.firstElementChild.style.cssText='width:150px;height:150px';
  ctx.parts.k=el(`<div class="kick" style="top:620px">${c.kicker}</div>`,n);
  ctx.parts.t=el(`<div class="abs" style="left:0;right:0;top:680px;text-align:center;font-family:PX,TE9;font-size:96px;color:#111;line-height:1.15">${c.title}</div>`,n);
  ctx.parts.p=el(`<div class="abs" style="left:0;right:0;top:860px;text-align:center"><span class="pill" style="background:linear-gradient(180deg,${g[0]},${g[1]})">${c.pill}</span></div>`,n);
  ctx.parts.d=el(`<div class="abs" style="left:80px;right:80px;top:1020px;text-align:center;font-family:PB,TE8;font-size:46px;color:#555b70;line-height:1.35">${c.desc||''}</div>`,n);
  ctx.parts.tiles=c.tiles.map((ic,i)=>el(`<div class="tile abs" style="left:${540-255+i*180-0}px;top:1300px">${svg(ic,['#4B3BE0','#1E5BFF','#FF5E1A'][i%3],2)}</div>`,n));
}
function RENDER_profile(ctx,lt){const p=ctx.parts,c=ctx.c;
  const s=x=>`translateY(${(1-eOut(x))*40}px) scale(${0.9+0.1*eBack(x)})`;
  p.av.style.transform=`scale(${eBack(lt/0.45)})`; p.av.style.opacity=clamp(lt/0.2);
  for(const [k,d] of [['k',0.15],['t',0.25],['d',0.55]]){const x=(lt-d)/0.35;p[k].style.opacity=clamp(x);p[k].style.transform=s(x)}
  const px=(lt-(c.pillAt??0.45))/0.4; p.p.style.opacity=clamp(px*2); p.p.style.transform=`scale(${px<=0?0.6:0.6+0.4*eBack(px)})`;
  p.tiles.forEach((t,i)=>{const x=(lt-0.75-i*0.12)/0.4;t.style.opacity=clamp(x);t.style.transform=`translateY(${(1-eBack(x))*60}px)`});
}
function BUILD_timeline(ctx){const {c,n}=ctx;
  ctx.parts.k=el(`<div class="kick" style="top:230px">${c.kicker}</div>`,n);
  const top=360, gap=c.gap||250, N=c.steps.length;
  ctx.top=top;ctx.gap=gap;
  ctx.parts.line=el(`<div class="tl-line" style="top:${top+27}px;height:${(N-1)*gap}px"></div>`,n);
  ctx.parts.fill=el(`<div class="tl-fill" style="top:${top+27}px;height:0px"></div>`,n);
  ctx.parts.steps=c.steps.map((s,i)=>{
    const node=el(`<div class="tl-node" style="top:${top+i*gap}px">${svg(s.icon||'check','#fff',2.6)}</div>`,n);
    const box=el(`<div class="tl-step" style="top:${top+i*gap-14}px"><div class="tl-v">${s.v}</div><div class="tl-t">${s.t}</div>${s.s?`<div class="tl-s">${s.s}</div>`:''}</div>`,n);
    return {node,box};});
}
function RENDER_timeline(ctx,lt){const p=ctx.parts,c=ctx.c;
  p.k.style.opacity=clamp(lt/0.3);
  let active=-1; c.steps.forEach((s,i)=>{if(lt>=s.at)active=i});
  p.steps.forEach((s,i)=>{const st=c.steps[i];const x=(lt-st.at)/0.35;
    const on=i<=active, cur=i===active;
    s.box.style.opacity= on? (cur?1:0.75) : 0.22;
    s.box.style.transform=`translateX(${on?(1-eOut(x))*40:0}px) scale(${cur?0.94+0.06*eBack(x):1})`;
    s.box.style.transformOrigin='0 50%';
    s.node.style.background= on? 'linear-gradient(135deg,#FFB020,#FF5E1A)':'#2a3266';
    s.node.style.boxShadow= cur? `0 0 ${20+14*Math.sin(lt*6)}px rgba(255,140,0,.85)`:'none';
    s.node.style.transform=`scale(${cur?0.7+0.3*eBack(x):1})`;
  });
  if(active>=0){const st=c.steps[active];const prev=active>0?active-1:0;const x=eOut((lt-st.at)/0.4);
    p.fill.style.height=`${(prev+(active-prev)*x)*ctx.gap}px`}
}
function BUILD_chart(ctx){const {c,n}=ctx;
  ctx.parts.k=el(`<div class="kick" style="top:250px">${c.kicker}</div>`,n);
  ctx.parts.t=el(`<div class="abs" style="left:0;right:0;top:310px;text-align:center;font-family:PX,TE9;font-size:84px;color:#fff">${c.title}</div>`,n);
  const W=900,H=620,X=90,Y=520; const pts=c.points; const max=c.max,min=c.min;
  const px=i=>X+60+i*(W-120)/(pts.length-1), py=v=>Y+40+(1-(v-min)/(max-min))*(H-120);
  let d=pts.map((p,i)=>`${i?'L':'M'}${px(i)},${py(p.v)}`).join(' ');
  const area=d+` L${px(pts.length-1)},${Y+H-40} L${px(0)},${Y+H-40} Z`;
  ctx.parts.svg=el(`<svg class="abs" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A00" stop-opacity=".45"/><stop offset="1" stop-color="#FF7A00" stop-opacity="0"/></linearGradient>
    <clipPath id="cp"><rect id="cpr" x="0" y="0" width="0" height="1920"/></clipPath></defs>
    <line x1="${X}" y1="${Y+H-40}" x2="${X+W}" y2="${Y+H-40}" stroke="#2a3266" stroke-width="4"/>
    <g clip-path="url(#cp)"><path d="${area}" fill="url(#ag)"/><path d="${d}" fill="none" stroke="#FFB020" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
    </svg>`,n);
  ctx.X=X;ctx.W=W;
  ctx.parts.dots=pts.map((p,i)=>el(`<div class="abs" style="left:${px(i)-80}px;top:${py(p.v)-150}px;width:160px;text-align:center">
     <div style="font-family:PX;font-size:44px;color:#fff">${p.l}</div>
     <div style="margin:14px auto 0;width:34px;height:34px;border-radius:50%;background:#FFB020;box-shadow:0 0 24px #FF8A00;border:6px solid #fff"></div></div>`,n));
  ctx.parts.ax=pts.map((p,i)=>el(`<div class="abs" style="left:${px(i)-150}px;top:${Y+H-10}px;width:300px;text-align:center;font-family:PB,TE8;font-size:38px;color:#8b93b5">${p.x}</div>`,n));
  ctx.parts.badge=el(`<div class="abs" style="left:0;right:0;top:${Y+H+90}px;text-align:center"><span class="pill" style="background:linear-gradient(180deg,#FF8A3D,#E8461A);font-size:54px">${c.pill}</span></div>`,n);
}
function RENDER_chart(ctx,lt){const p=ctx.parts,c=ctx.c;
  p.k.style.opacity=clamp(lt/0.3); p.t.style.opacity=clamp((lt-0.1)/0.3);
  const x=eOut((lt-0.3)/1.6); ctx.parts.svg.querySelector('#cpr').setAttribute('width',ctx.X+ctx.W*x+20);
  p.dots.forEach((d,i)=>{const at=0.3+1.6*i/(p.dots.length-1);const y=(lt-at)/0.35;d.style.opacity=clamp(y*2);d.style.transform=`scale(${y<=0?0:eBack(y)})`});
  p.ax.forEach((d,i)=>{d.style.opacity=clamp((lt-0.3-0.4*i)/0.3)});
  const b=(lt-(c.pillAt??2.0))/0.4;p.badge.style.opacity=clamp(b*2);p.badge.style.transform=`scale(${b<=0?0.6:0.6+0.4*eBack(b)})`;
}
function BUILD_photo(ctx){const {c,n}=ctx;
  n.style.background='radial-gradient(circle at 50% 40%,#2b2f45,#0b0c14 70%)';
  ctx.parts.f=el(`<div class="abs" style="left:110px;top:330px;width:860px;height:780px;padding:16px;border-radius:30px;background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.6)">
    <div style="width:100%;height:100%;border-radius:18px;overflow:hidden"><img src="${c.img}" style="width:100%;height:100%;object-fit:cover"></div></div>`,n);
  ctx.parts.img=ctx.parts.f.querySelector('img');
  ctx.parts.l=el(`<div class="abs" style="left:560px;top:1060px;padding:12px 30px;border-radius:16px;background:linear-gradient(180deg,#FF9A3D,#F05A12);font-family:PX,TE9;font-size:46px;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.4)">${c.label}</div>`,n);
}
function RENDER_photo(ctx,lt){const p=ctx.parts;const x=eBack(lt/0.5);
  p.f.style.transform=`rotate(${-4+2*(1-x)}deg) scale(${0.85+0.15*x})`;p.f.style.opacity=clamp(lt/0.2);
  p.img.style.transform=`scale(${1.05+0.04*lt})`;
  const y=(lt-0.5)/0.35;p.l.style.opacity=clamp(y*2);p.l.style.transform=`rotate(-4deg) scale(${y<=0?0.5:0.5+0.5*eBack(y)})`;
}
function BUILD_terminal(ctx){const {c,n}=ctx; n.style.background='#000';
  ctx.parts.box=el(`<div class="term"><div class="hd">${c.head}</div></div>`,n);
  ctx.parts.lines=c.lines.map(l=>{const d=el(`<div class="ln"></div>`,ctx.parts.box);return {d,l}});
  ctx.seg=new Intl.Segmenter('te',{granularity:'grapheme'});
}
function RENDER_terminal(ctx,lt){const p=ctx.parts;let last=null;
  p.lines.forEach(({d,l})=>{const txt=l.t;const g=[...ctx.seg.segment(txt)].map(s=>s.segment);
    const k=lt<l.at?0:Math.min(g.length,Math.floor((lt-l.at)*28)+1);
    const done=k>=g.length;
    d.innerHTML=(k?('&gt; '+g.slice(0,k).join('')+(done?' <span style="color:#fff">✓</span>':'')):'');
    if(k>0)last=d;});
  document.querySelectorAll('.cursor').forEach(x=>x.remove());
  if(last && Math.floor(lt*2.5)%2===0) last.insertAdjacentHTML('beforeend','<span class="cursor"></span>');
}
function BUILD_carcam(ctx){const {c,n}=ctx;
  ctx.parts.k=el(`<div class="kick" style="top:260px">${c.kicker}</div>`,n);
  ctx.parts.t=el(`<div class="abs" style="left:0;right:0;top:320px;text-align:center;font-family:PX,TE9;font-size:86px;color:#fff">${c.title}</div>`,n);
  ctx.parts.car=el(`<div class="abs" style="left:190px;top:560px;width:700px;height:520px;display:flex;align-items:center;justify-content:center">${svg('car','#ffffff',1.2)}</div>`,n);
  ctx.parts.car.firstChild.style.cssText='width:620px;height:620px;filter:drop-shadow(0 0 30px rgba(80,140,255,.6))';
  const pos=[[110,520],[830,520],[110,1010],[830,1010]];

function RENDER_journey(ctx,lt){const p=ctx.parts,c=ctx.c;p.k.style.opacity=clamp(lt/0.3);
  let act=-1;c.nodes.forEach((s,i)=>{if(lt>=s.at)act=i});

  const prog=clamp((lt-0.2)/1.0);p.line.style.clipPath=`inset(0 0 ${100-100*prog}% 0)`;

const BUILD={profile:BUILD_profile,timeline:BUILD_timeline,chart:BUILD_chart,photo:BUILD_photo,terminal:BUILD_terminal,carcam:BUILD_carcam,journey:BUILD_journey};

  const x=s.x!==undefined?s.x:(s.side==="l"?28:902), y=s.y||1330;

// ---- title
const TT=D.title||['',''];const HAS_T=!!D.title;
const t1=el(`<div class="ttl" ${HAS_T?'':'style="display:none"'} style="top:62px"><span style="background:#E53935;color:#fff;font-size:66px;padding:8px 34px 12px;border-radius:14px">${TT[0]}</span></div>`);

// ---- end screen
const E={};
E.wrap=el(`<div class="abs" style="inset:0;z-index:40;display:none;background:radial-gradient(circle at 50% 45%,#1d1f3a,#07070f 70%)"></div>`);
E.yt=el(`<div class="abs" style="left:390px;top:640px;width:300px;height:210px;border-radius:60px;background:linear-gradient(180deg,#FF3B3B,#D10000);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(255,0,0,.35)"><div style="width:0;height:0;border-left:90px solid #fff;border-top:56px solid transparent;border-bottom:56px solid transparent;margin-left:18px"></div></div>`,E.wrap);
E.tx=el(`<div class="abs" style="left:0;right:0;top:920px;text-align:center;font-family:RAMA;font-size:104px;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.4)">లైక్ & సబ్‌స్క్రైబ్ చేయండి</div>`,E.wrap);

E.cur=el(`<div class="abs" style="left:0;top:0;width:60px;height:60px">${'<svg viewBox="0 0 24 24" width="60" height="60"><path d="M4 2l14 10-6 1 4 8-3 1-4-8-5 4z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg>'}</div>`,E.wrap);

function render(t){
  let whiteCard=false;
  for(const it of items){
    const on=t>=it.a && t<it.b; const lt=t-it.a, rem=it.b-t;
    if(it.kind==='card'){const n=it.ctx.n;
      if(!on){n.style.display='none';continue}
      n.style.display='block';
      const i=eOut(lt/0.28), o=clamp(rem/0.22);
      n.style.opacity=Math.min(i,o); n.style.transform=`scale(${1.06-0.06*i})`;
      if(it.ctx.c.theme==='white' && n.style.opacity>0.5) whiteCard=true;
      RENDER[it.ctx.c.type](it.ctx,lt);
    } else if(it.kind==='num'){const n=it.n; if(!on){n.style.display='none';continue}
      n.style.display='block';const x=lt/0.35;
      n.style.opacity=Math.min(clamp(x*2),clamp(rem/0.2));
      n.style.transform=`translateX(${(1-eOut(x))*-120}px) scale(${0.6+0.4*eBack(x)}) rotate(-6deg)`;
    } else if(it.kind==='stk'){const n=it.n; if(!on){n.style.display='none';continue}
      n.style.display='flex';const x=lt/0.4;
      const out=clamp(rem/0.2);
      n.style.opacity=Math.min(clamp(x*3),out);
      n.style.transform=`translateY(${Math.sin(lt*3+it.ph)*6}px) rotate(${it.rot+Math.sin(lt*2+it.ph)*2}deg) scale(${(x<=0?0:eBack(x))*(0.6+0.4*out)})`;
    }
  }
  for(const it of items){ if(it.kind!=='cap')continue;
    const on=t>=it.a && t<it.b && !whiteCard; const n=it.n;
    if(!on){n.style.display='none';continue}
    n.style.display='flex';const lt=t-it.a;
    it.lines.forEach((ln,i)=>{
      if(ln.dataset.fit===undefined) fit(ln,980);
      const f=+ln.dataset.fit;
      const isH=ln.classList.contains('ch');const x=lt/(isH?0.28:0.16);
      const sc=isH? (x<=0?0:0.55+0.45*eBack(x)) : 0.9+0.1*eOut(x);
      const wig = isH ? Math.sin(lt*14)*Math.max(0,1-lt/0.6)*5 : 0;
      ln.style.opacity=clamp(x*2.5); ln.style.transform=`translateY(${(1-eOut(x))*16}px) rotate(${wig}deg) scale(${sc*f})`;
    });
  }
  // board
  const me=D.main_end; let bx,by,bs,ang;
  const sw=3.5*Math.sin(2*Math.PI*t/2.6);
  bwrap.style.display = t<me ? 'none' : 'block';
  {const k=eBack((t-me-0.2)/0.6);bx=540;by=200-(1-clamp(k))*260;bs=1.55;ang=3.5*Math.sin(2*Math.PI*(t-me)/2.6)*clamp((t-me-0.6)/0.5);bwrap.style.opacity=clamp((t-me-0.2)/0.3)}
  const W=330*bs,H=150*bs,drop=70*bs;
  const bx0=bx-W/2, by0=by+drop;
  board.style.left=bx0+'px';board.style.top=by0+'px';board.style.transform=`scale(${bs})`;board.style.transformOrigin='0 0';board.style.width='330px';board.style.height='150px';
  bwrap.style.transformOrigin=`${bx}px ${by}px`;bwrap.style.transform=`rotate(${ang}deg)`;
  const s1=bsv.querySelector('#s1'),s2=bsv.querySelector('#s2'),nl=bsv.querySelector('#nail');
  s1.setAttribute('x1',bx);s1.setAttribute('y1',by);s1.setAttribute('x2',bx0+55*bs);s1.setAttribute('y2',by0+18*bs);
  s2.setAttribute('x1',bx);s2.setAttribute('y1',by);s2.setAttribute('x2',bx0+W-55*bs);s2.setAttribute('y2',by0+18*bs);
  nl.setAttribute('cx',bx);nl.setAttribute('cy',by);
  // title
  {const o=t<me?1:clamp(1-(t-me)/0.3); t1.style.opacity=t2.style.opacity=o;
   const k=eBack(t/0.5); t1.style.transform=`scale(${0.6+0.4*k})`; t2.style.transform=`scale(${0.6+0.4*eBack((t-0.12)/0.5)})`;}
  // end screen
  if(t>=me){E.wrap.style.display='block';const lt=t-me;
    E.wrap.style.opacity=clamp(lt/0.25);
    E.yt.style.transform=`scale(${eBack((lt-0.15)/0.5)})`;
    E.tx.style.opacity=clamp((lt-0.4)/0.3);E.tx.style.transform=`translateY(${(1-eOut((lt-0.4)/0.4))*30}px)`;
    const bt=(lt-0.7)/0.4;E.like.style.transform=E.sub.style.transform=`scale(${bt<=0?0:eBack(bt)})`;
    // cursor: move to like (1.4s) click, then to subscribe (2.3s) click
    let cx,cy; const P=[[700,1500],[330,1170],[740,1170]];
    if(lt<1.4){const k=eOut((lt-0.9)/0.5);cx=P[0][0]+(P[1][0]-P[0][0])*k;cy=P[0][1]+(P[1][1]-P[0][1])*k}
    else if(lt<2.3){const k=eOut((lt-1.7)/0.5);cx=P[1][0]+(P[2][0]-P[1][0])*k;cy=P[1][1]+(P[2][1]-P[1][1])*k}
    else {cx=P[2][0];cy=P[2][1]}
    E.cur.style.left=cx+'px';E.cur.style.top=cy+'px';E.cur.style.opacity=clamp((lt-0.9)/0.2);

    E.sub.style.transform+=` scale(${press(2.35)})`;
  } else E.wrap.style.display='none';
}
