<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:TelB;src:url(../../insurance/v2/fonts/TeluguCap800.ttf)}
@font-face{font-family:PopB;src:url(../../insurance/v2/fonts/PopB.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden}
.shot{position:absolute;inset:0;opacity:0}
.bg{position:absolute;left:-60px;top:-60px;width:1200px;height:2040px;object-fit:cover}
.fgwrap{position:absolute;left:0;width:1080px;top:0;height:1920px}
.fg{position:absolute;left:50%;top:820px;width:1320px;transform-origin:50% 50%;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 88%,transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 88%,transparent 100%);
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
#leak{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
#parts{position:absolute;inset:0}
#grain{position:absolute;inset:-256px;background:url(panels/grain.png);opacity:.07;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(0,0,0,.62) 100%)}
#shade{position:absolute;left:0;right:0;bottom:0;height:640px;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(8,6,20,.78) 55%,rgba(8,6,20,.9))}
#topshade{position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(to top,rgba(0,0,0,0),rgba(8,6,20,.55))}
#title{position:absolute;top:120px;width:100%;text-align:center;color:#ffe9b8;font:44px TelB;letter-spacing:2px;text-shadow:0 0 18px rgba(255,190,90,.55)}
#title .ln{display:inline-block;width:90px;height:2px;background:linear-gradient(90deg,transparent,#ffd9a0);vertical-align:middle;margin:0 22px}
#title .ln.r{background:linear-gradient(270deg,transparent,#ffd9a0)}
#lyr{position:absolute;left:60px;right:60px;top:1500px;text-align:center}
#te{font:76px/1.32 TelB;color:#fff;text-shadow:0 0 22px rgba(255,200,120,.45),0 4px 14px rgba(0,0,0,.7)}
#te span{display:inline-block;margin:0 10px}
#en{margin-top:22px;font:36px/1.35 PopB;color:#ffe2ad;letter-spacing:1px;text-shadow:0 3px 10px rgba(0,0,0,.8)}
#fade{position:absolute;inset:0;background:#000}
</style></head><body>
<div id="stage"></div>
<canvas id="leak" width="540" height="960"></canvas>
<canvas id="parts" width="1080" height="1920"></canvas>
<div id="topshade"></div><div id="shade"></div><div id="vig"></div>
<div id="title"><span class="ln"></span>మరి అంతగా<span class="ln r"></span></div>
<div id="lyr"><div id="te"></div><div id="en"></div></div>
<div id="grain"></div>
<div id="fade"></div>
<script>
const LINES = window.__LINES__, TOTAL = window.__TOTAL__;
// panel for each lyric line; the last line gets two panels
const MAP = ['A','B','C','D','E','F','I','H','K','J','N','L','G','M',['O','P']];
// Ken Burns moves: [scale0, scale1, x0, x1, y0, y1] (px offsets)
const MOVES = [[1.02,1.14,0,0,0,-20],[1.14,1.03,0,0,-10,10],[1.08,1.12,40,-40,0,0],[1.08,1.12,-40,40,0,0],[1.04,1.16,0,0,30,-30],[1.12,1.04,-30,30,0,0]];
const shots=[];
LINES.forEach((l,i)=>{ const m=MAP[i];
  if (Array.isArray(m)){ const mid=48.55; shots.push({k:m[0],s:l.start,e:mid}); shots.push({k:m[1],s:mid,e:l.end+0.4}); }
  else shots.push({k:m,s:l.start,e:l.end}); });
const stage=document.getElementById('stage');
shots.forEach((sh,i)=>{ const d=document.createElement('div'); d.className='shot';
  d.innerHTML=`<img class="bg" src="panels/${sh.k}_bg.jpg"><div class="fgwrap"><img class="fg" src="panels/${sh.k}.jpg"></div>`;
  stage.appendChild(d); sh.el=d; sh.bg=d.querySelector('.bg'); sh.fg=d.querySelector('.fg'); sh.mv=MOVES[i%MOVES.length]; });
// last panel (P, wide sunset) is shown larger
const clamp=v=>Math.max(0,Math.min(1,v)), ease=v=>v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2, eo=v=>1-Math.pow(1-v,3);
const XF=0.5;  // crossfade length
// lyric words
const te=document.getElementById('te'), en=document.getElementById('en'); let curL=-1, spans=[];
function setLine(i){ curL=i; const l=LINES[i]; te.innerHTML=''; spans=[];
  l.text.split('|').forEach((row,ri)=>{ if(ri) te.appendChild(document.createElement('br'));
    row.split(' ').forEach(w=>{ const s=document.createElement('span'); s.textContent=w; te.appendChild(s); spans.push(s); }); });
  en.innerHTML=(l.en||'').replace('|','<br>'); }
// particles (deterministic)
const pc=document.getElementById('parts').getContext('2d');
const P=[...Array(70)].map((_,i)=>{ const r=Math.sin(i*91.7)*43758.5; const f=r-Math.floor(r); const g=(Math.sin(i*12.9)*9341.1)%1;
  return {x:Math.abs(g)*1080, y:f*1920, s:2+((i*37)%7), v:8+((i*13)%20), ph:i*1.3, warm:i%3!==0}; });
function particles(t){ pc.clearRect(0,0,1080,1920);
  P.forEach(p=>{ const y=((p.y - t*p.v)%1920+1920)%1920, x=p.x+Math.sin(t*.6+p.ph)*24; const a=.25+.25*Math.sin(t*1.7+p.ph);
    const g=pc.createRadialGradient(x,y,0,x,y,p.s*3); const c=p.warm?'255,215,150':'200,225,255';
    g.addColorStop(0,`rgba(${c},${a})`); g.addColorStop(1,`rgba(${c},0)`); pc.fillStyle=g; pc.beginPath(); pc.arc(x,y,p.s*3,0,7); pc.fill(); }); }
// light leaks: soft moving warm blobs, stronger around cuts
const lc=document.getElementById('leak').getContext('2d');
function leaks(t, cutAmt){ lc.clearRect(0,0,540,960);
  const blobs=[[.15+.1*Math.sin(t*.31),.2+.08*Math.cos(t*.23),'255,150,60'],[.9+.08*Math.sin(t*.27+1),.55+.1*Math.sin(t*.19),'255,90,120'],[.5+.3*Math.sin(t*.13+2),.05,'255,220,150']];
  blobs.forEach(([bx,by,c],i)=>{ const a=(.10+.05*Math.sin(t*.9+i))+cutAmt*.35; const x=bx*540,y=by*960,r=380;
    const g=lc.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${c},${a})`); g.addColorStop(1,`rgba(${c},0)`); lc.fillStyle=g; lc.fillRect(0,0,540,960); }); }

window.render=function(t){
  // shots
  let cutAmt=0;
  shots.forEach((sh,i)=>{ const inS = i===0? sh.s : sh.s - XF/2, outE = i===shots.length-1? sh.e : sh.e + XF/2;
    if (t<inS-0.01 || t>outE+0.01){ sh.el.style.display='none'; return; }
    sh.el.style.display='';
    let op=1; if (i>0) op=Math.min(op, clamp((t-inS)/XF)); if (i<shots.length-1) op=Math.min(op, clamp((outE-t)/XF));
    sh.el.style.opacity=ease(op);
    const p=clamp((t-inS)/(outE-inS)), q=ease(p), m=sh.mv;
    const big = sh.k==="P"? 1.45 : 1;           // wide final panel fills more of the frame
    const sc=(m[0]+(m[1]-m[0])*q)*big, x=m[2]+(m[3]-m[2])*q, y=m[4]+(m[5]-m[4])*q;
    const h=sh.fg.naturalHeight*1320/sh.fg.naturalWidth;
    sh.fg.style.transform=`translate(calc(-50% + ${x}px), calc(${-h/2 + y}px)) scale(${sc})`;
    // incoming shot starts slightly blurred
    const bl = i>0 ? (1-clamp((t-inS)/XF))*8 : 0; sh.fg.style.filter = bl>0.05? `blur(${bl.toFixed(1)}px)`:'none';
    sh.bg.style.transform=`scale(${1.05+0.08*q})`;
    if (i>0) cutAmt=Math.max(cutAmt, 1-Math.abs(t-sh.s)/(XF*0.8));
  });
  leaks(t, clamp(cutAmt)); particles(t);
  document.getElementById('grain').style.transform=`translate(${(Math.floor(t*30)*137)%256}px,${(Math.floor(t*30)*71)%256}px)`;
  // lyrics
  let li=LINES.findIndex(l=>t<l.end); if(li<0) li=LINES.length-1;
  if (li!==curL) setLine(li);
  const l=LINES[li], d=l.end-l.start, lt=t-l.start;
  const n=spans.length, span=Math.min(d*.55, 0.38*n+.3);
  spans.forEach((s,k)=>{ const st=.08+span*k/n; const a=eo(clamp((lt-st)/.45));
    s.style.opacity=a; s.style.transform=`translateY(${(1-a)*26}px)`; s.style.filter= a<1? `blur(${((1-a)*10).toFixed(1)}px)`:'none'; });
  const ea=eo(clamp((lt-span-.15)/.5)); en.style.opacity=ea; en.style.transform=`translateY(${(1-ea)*14}px)`;
  const outA = li===LINES.length-1? 1 : clamp((l.end-t)/.22);   // quick fade before next line
  document.getElementById('lyr').style.opacity=outA;
  document.getElementById('title').style.opacity = .85*clamp(t/1.2)*clamp((TOTAL-t)/1.2);
  // fade from/to black
  document.getElementById('fade').style.opacity = Math.max(1-clamp(t/.7), clamp((t-(TOTAL-.9))/.9));
};
Promise.all([document.fonts.load('76px TelB','అ'),document.fonts.load('36px PopB','A'),...[...document.images].map(im=>im.decode())]).then(()=>{ window.__ready=true; });
</script></body></html>
