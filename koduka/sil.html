</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
// Cinematic silhouette scenes for "Naa Koduka". One scene per lyric line:
// elements rise in as dark silhouettes while the line is sung, then (last ~25% of the line)
// the sky saturates and every shape blooms into full colour. Scenes cross-fade.
// window.__DATA__ = {total, scenes:[{a,b,key,seed}]}: a = scene start, b = end of the sung line (colour peaks at b); window.render(t) draws frame at t seconds.
const X = document.getElementById('c').getContext('2d');
const W = 1080, H = 1920, HOR = 1290;                // horizon line
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = v => { v = cl(v); return v * v * (3 - 2 * v); };
const lerp = (a, b, k) => a + (b - a) * k;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mix(c1, c2, k) { const a = hex(c1), b = hex(c2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], cl(k)))).join(',')})`; }
const SIL = '#0b0a12';
// ---------- palettes: [top, mid, bottom-at-horizon], silhouette phase uses muted version ----------
const SKY = {
  dawn: ['#3b2a63', '#e0708a', '#ffc27a'], day: ['#4aa3e8', '#9fd3f5', '#fff1c4'], sunset: ['#2a1b4d', '#c2456b', '#ffa94d'],
  night: ['#050a24', '#14245a', '#33508f'], moon: ['#0a1236', '#24407e', '#7d94c9'], storm: ['#14121f', '#3b3557', '#6d5f86'],
  gold: ['#5a2a6e', '#ef7b45', '#ffd36e'], dusk: ['#1d2550', '#6b4c8f', '#f09a7a'], hot: ['#c8501e', '#f2913a', '#ffe08a'],
};
const GROUND = { dawn: '#3c4a2a', day: '#4f8a2e', sunset: '#3a2a2a', night: '#101a24', moon: '#18263a', storm: '#1e1b26', gold: '#5a4a22', dusk: '#2a2a3a', hot: '#8a5a2a' };
function muted(c) { const [r, g, b] = hex(c); const l = (r + g + b) / 3; return '#' + [r, g, b].map(v => Math.round(lerp(v, l * 0.55, 0.62)).toString(16).padStart(2, '0')).join(''); }
// ---------- drawing helpers ----------
let K = 0, A = 1, TT = 0, R = rng(1);      // K = colour amount (0 silhouette .. 1 full colour), TT = time, A = element alpha
const col = c => mix(SIL, c, K);           // element colour at current colour amount
function poly(pts, fill) { X.beginPath(); pts.forEach(([x, y], i) => i ? X.lineTo(x, y) : X.moveTo(x, y)); X.closePath(); X.fillStyle = fill; X.fill(); }
function circ(x, y, r, fill) { X.beginPath(); X.arc(x, y, r, 0, Math.PI * 2); X.fillStyle = fill; X.fill(); }
function ell(x, y, rx, ry, rot, fill) { X.beginPath(); X.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); X.fillStyle = fill; X.fill(); }
function limb(pts, w, stroke) { X.beginPath(); pts.forEach(([x, y], i) => i ? X.lineTo(x, y) : X.moveTo(x, y)); X.lineWidth = w; X.lineCap = 'round'; X.lineJoin = 'round'; X.strokeStyle = stroke; X.stroke(); }
function curve(p0, c1, c2, p1, w, stroke) { X.beginPath(); X.moveTo(...p0); X.bezierCurveTo(...c1, ...c2, ...p1); X.lineWidth = w; X.lineCap = 'round'; X.strokeStyle = stroke; X.stroke(); }
function glow(x, y, r, c, a) { const g = X.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c.replace('rgb', 'rgba').replace(')', `,${a})`)); g.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = g; X.fillRect(x - r, y - r, 2 * r, 2 * r); }
const rgbA = (c, a) => { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; };
// ---------- figures ----------
// mother: feet centre (x,y), height h, flip 1 = facing right
function mother(x, y, h, pose = 'stand', f = 1) {
  const q = (a, b) => [x + a * h * f, y + b * h];
  const skin = col('#9a5b34'), saree = col('#c2185b'), pallu = col('#ffb300'), hair = col('#1a1010');
  // saree skirt
  X.beginPath(); X.moveTo(...q(-0.07, -0.50)); X.bezierCurveTo(...q(-0.12, -0.3), ...q(-0.2, -0.1), ...q(-0.19, 0));
  X.lineTo(...q(0.17, 0)); X.bezierCurveTo(...q(0.16, -0.12), ...q(0.1, -0.32), ...q(0.08, -0.50)); X.closePath(); X.fillStyle = saree; X.fill();
  // border at hem
  poly([q(-0.19, -0.03), q(0.17, -0.03), q(0.17, 0), q(-0.19, 0)], pallu);
  // torso
  poly([q(-0.08, -0.78), q(0.07, -0.78), q(0.085, -0.5), q(-0.075, -0.5)], saree);
  // pallu over shoulder flowing behind
  X.beginPath(); X.moveTo(...q(0.06, -0.79)); X.bezierCurveTo(...q(-0.05, -0.7), ...q(-0.12, -0.6), ...q(-0.2 - 0.02 * Math.sin(TT * 1.3), -0.42));
  X.lineTo(...q(-0.15, -0.4)); X.bezierCurveTo(...q(-0.06, -0.55), ...q(0.0, -0.66), ...q(0.08, -0.72)); X.closePath(); X.fillStyle = pallu; X.fill();
  // neck + head + bun
  poly([q(-0.02, -0.82), q(0.02, -0.82), q(0.02, -0.77), q(-0.02, -0.77)], skin);
  circ(...q(0.005, -0.88), h * 0.062, skin);
  X.beginPath(); X.arc(...q(-0.005, -0.895), h * 0.066, Math.PI * (f > 0 ? 0.75 : 0.25), Math.PI * (f > 0 ? 2.05 : 1.45 - 0.2) ); X.fillStyle = hair; X.fill();
  circ(...q(-0.07, -0.88), h * 0.035, hair);                            // bun
  if (K > 0.5) circ(...q(0.02, -0.905), h * 0.008, col('#d32f2f'));      // bindi
  const aw = h * 0.034;
  const arms = {
    stand: [[q(0.05, -0.76), q(0.09, -0.62), q(0.1, -0.5)], [q(-0.05, -0.76), q(-0.09, -0.62), q(-0.09, -0.5)]],
    hold: [[q(0.05, -0.76), q(0.12, -0.62), q(0.2, -0.5)], [q(-0.05, -0.76), q(-0.09, -0.62), q(-0.09, -0.5)]],
    point: [[q(0.05, -0.76), q(0.17, -0.88), q(0.27, -1.0)], [q(-0.05, -0.76), q(-0.09, -0.62), q(-0.09, -0.5)]],
    bless: [[q(0.05, -0.76), q(0.17, -0.7), q(0.27, -0.62)], [q(-0.05, -0.76), q(-0.09, -0.62), q(-0.09, -0.5)]],
    cradle: [[q(0.05, -0.76), q(0.13, -0.66), q(0.0, -0.6)], [q(-0.05, -0.76), q(0.08, -0.7), q(0.1, -0.64)]],
    open: [[q(0.05, -0.76), q(0.17, -0.74), q(0.28, -0.8)], [q(-0.05, -0.76), q(-0.17, -0.74), q(-0.28, -0.8)]],
    hug: [[q(0.05, -0.76), q(0.16, -0.66), q(0.18, -0.56)], [q(-0.05, -0.76), q(0.06, -0.64), q(0.12, -0.56)]],
    lamp: [[q(0.05, -0.76), q(0.16, -0.66), q(0.24, -0.66)], [q(-0.05, -0.76), q(-0.09, -0.62), q(-0.09, -0.5)]],
    sing: [[q(0.05, -0.76), q(0.12, -0.64), q(0.2, -0.6)], [q(-0.05, -0.76), q(0.08, -0.66), q(0.18, -0.62)]],
  }[pose];
  arms.forEach(a => limb(a, aw, skin));
}
// child: feet centre, height h
function child(x, y, h, pose = 'stand', f = 1, shirt = '#29b6f6') {
  const q = (a, b) => [x + a * h * f, y + b * h];
  const skin = col('#a8653a'), sh = col(shirt), pant = col('#5d4037'), hair = col('#141010');
  const w = h * 0.075;
  if (pose === 'sleep') {   // lying on side, x,y = centre of body on ground
    ell(...q(0, -0.12), h * 0.42, h * 0.11, 0, sh); ell(...q(0.32, -0.13), h * 0.11, h * 0.08, 0, pant);
    circ(...q(-0.5, -0.17), h * 0.12, skin); X.beginPath(); X.arc(...q(-0.5, -0.19), h * 0.125, Math.PI, 2 * Math.PI); X.fillStyle = hair; X.fill(); return;
  }
  if (pose === 'sit') {
    limb([q(0.0, -0.3), q(0.2, -0.32), q(0.26, -0.04)], w, pant); limb([q(0.0, -0.3), q(0.16, -0.3), q(0.2, -0.04)], w, pant);
    poly([q(-0.09, -0.68), q(0.08, -0.68), q(0.09, -0.3), q(-0.1, -0.3)], sh);
    circ(...q(0.0, -0.8), h * 0.115, skin); X.beginPath(); X.arc(...q(0.0, -0.82), h * 0.12, Math.PI * 0.95, Math.PI * 2.1); X.fillStyle = hair; X.fill();
    limb([q(0.05, -0.62), q(0.15, -0.46), q(0.22, -0.36)], w * 0.8, skin); limb([q(-0.05, -0.62), q(0.05, -0.46), q(0.16, -0.38)], w * 0.8, skin);
    return;
  }
  const lg = { stand: [[0.04, 0.05], [-0.04, -0.05]], walk: [[0.12, 0.16], [-0.1, -0.12]], run: [[0.2, 0.26], [-0.16, -0.24]] }[pose] || [[0.04, 0.05], [-0.04, -0.05]];
  const sw = pose === 'walk' || pose === 'run' ? Math.sin(TT * 5) * 0.03 : 0;
  limb([q(0.03, -0.42), q(lg[0][0] + sw, -0.2), q(lg[0][1] + sw, 0)], w, pant);
  limb([q(-0.03, -0.42), q(lg[1][0] - sw, -0.2), q(lg[1][1] - sw, 0)], w, pant);
  poly([q(-0.1, -0.44), q(0.1, -0.44), q(0.09, -0.32), q(-0.09, -0.32)], pant);
  poly([q(-0.1, -0.7), q(0.1, -0.7), q(0.11, -0.42), q(-0.11, -0.42)], sh);
  circ(...q(0.0, -0.82), h * 0.115, skin); X.beginPath(); X.arc(...q(0.0, -0.84), h * 0.12, Math.PI * 0.95, Math.PI * 2.1); X.fillStyle = hair; X.fill();
  const arms = {
    stand: [[q(0.08, -0.66), q(0.12, -0.54), q(0.12, -0.44)], [q(-0.08, -0.66), q(-0.12, -0.54), q(-0.12, -0.44)]],
    walk: [[q(0.08, -0.66), q(0.16, -0.54), q(0.2, -0.46)], [q(-0.08, -0.66), q(-0.14, -0.55), q(-0.18, -0.48)]],
    run: [[q(0.08, -0.66), q(0.2, -0.6), q(0.26, -0.7)], [q(-0.08, -0.66), q(-0.18, -0.56), q(-0.26, -0.6)]],
    reach: [[q(0.08, -0.66), q(-0.06, -0.8), q(-0.16, -0.94)], [q(-0.08, -0.66), q(-0.12, -0.54), q(-0.12, -0.44)]],
    up: [[q(0.08, -0.66), q(0.18, -0.86), q(0.22, -1.02)], [q(-0.08, -0.66), q(-0.18, -0.86), q(-0.22, -1.02)]],
    rub: [[q(0.08, -0.66), q(0.14, -0.72), q(0.05, -0.83)], [q(-0.08, -0.66), q(-0.14, -0.72), q(-0.05, -0.83)]],
    scared: [[q(0.08, -0.66), q(0.2, -0.76), q(0.14, -0.9)], [q(-0.08, -0.66), q(0.02, -0.76), q(0.06, -0.9)]],
    plant: [[q(0.08, -0.66), q(0.2, -0.5), q(0.28, -0.36)], [q(-0.08, -0.66), q(0.1, -0.5), q(0.22, -0.38)]],
    bag: [[q(0.08, -0.66), q(0.12, -0.54), q(0.12, -0.44)], [q(-0.08, -0.66), q(-0.12, -0.54), q(-0.12, -0.44)]],
  }[pose] || [[q(0.08, -0.66), q(0.12, -0.54), q(0.12, -0.44)], [q(-0.08, -0.66), q(-0.12, -0.54), q(-0.12, -0.44)]];
  arms.forEach(a => limb(a, w * 0.8, skin));
  if (pose === 'bag') { poly([q(-0.2, -0.68), q(-0.08, -0.68), q(-0.08, -0.42), q(-0.2, -0.42)], col('#e53935')); }
}
// ---------- nature & props ----------
function tree(x, y, h, kind = 'round', fruits = 0) {
  const tr = col('#5d4037'), lf = col('#2e7d32'), lf2 = col('#43a047');
  const sway = Math.sin(TT * 0.8 + x) * h * 0.01;
  poly([[x - h * 0.04, y], [x + h * 0.04, y], [x + h * 0.025, y - h * 0.55], [x - h * 0.025, y - h * 0.55]], tr);
  limb([[x, y - h * 0.45], [x + h * 0.14, y - h * 0.62]], h * 0.03, tr); limb([[x, y - h * 0.4], [x - h * 0.13, y - h * 0.58]], h * 0.03, tr);
  if (kind === 'palm') { for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (i - 3) * 0.45; curve([x, y - h * 0.55], [x + Math.cos(a) * h * 0.2, y - h * 0.55 + Math.sin(a) * h * 0.25], [x + Math.cos(a) * h * 0.35, y - h * 0.5 + Math.sin(a) * h * 0.1], [x + Math.cos(a) * h * 0.42 + sway, y - h * 0.4], h * 0.04, lf); } return; }
  const blobs = [[0, -0.78, 0.26], [-0.18, -0.66, 0.18], [0.19, -0.67, 0.19], [-0.08, -0.92, 0.17], [0.12, -0.9, 0.16]];
  blobs.forEach(([bx, by, r], i) => circ(x + bx * h + sway, y + by * h, r * h, i % 2 ? lf2 : lf));
  for (let i = 0; i < fruits; i++) { const rr = rng(i + 7); circ(x + (rr() - 0.5) * h * 0.45 + sway, y - h * (0.65 + rr() * 0.3), h * 0.025, col(i % 2 ? '#ff7043' : '#ffca28')); }
}
function bush(x, y, s, thorn = false) {
  const c1 = col(thorn ? '#3e5a2a' : '#388e3c');
  [[0, 0, 1], [-0.7, 0.15, 0.75], [0.7, 0.15, 0.75]].forEach(([dx, dy, r]) => circ(x + dx * s, y - s * 0.5 + dy * s, r * s * 0.6, c1));
  if (thorn) for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; limb([[x + Math.cos(a) * s * 0.7, y - s * 0.5 + Math.sin(a) * s * 0.55], [x + Math.cos(a) * s * 1.05, y - s * 0.5 + Math.sin(a) * s * 0.85]], 5, col('#6d4c41')); }
}
function flower(x, y, s, c = '#ec407a') {
  limb([[x, y], [x + Math.sin(TT + x) * s * 0.1, y - s * 1.4]], s * 0.12, col('#43a047'));
  const cx = x + Math.sin(TT + x) * s * 0.1, cy = y - s * 1.5;
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + TT * 0.2; ell(cx + Math.cos(a) * s * 0.4, cy + Math.sin(a) * s * 0.4, s * 0.32, s * 0.18, a, col(c)); }
  circ(cx, cy, s * 0.22, col('#ffd54f'));
}
function grass(y0, n, h, c = '#2e5d1e', seed = 3) { const r = rng(seed); X.strokeStyle = col(c); X.lineWidth = 4; X.lineCap = 'round';
  for (let i = 0; i < n; i++) { const x = r() * W, hh = h * (0.5 + r()), s = Math.sin(TT * 1.5 + x * 0.02) * 6; X.beginPath(); X.moveTo(x, y0 + r() * 40); X.quadraticCurveTo(x + s, y0 - hh * 0.5, x + s * 2, y0 - hh); X.stroke(); } }
function hill(y, amp, c, ph = 0) { X.beginPath(); X.moveTo(0, H); for (let x = 0; x <= W; x += 20) X.lineTo(x, y - amp * (0.6 + 0.4 * Math.sin(x / 260 + ph)) - amp * 0.3 * Math.sin(x / 90 + ph * 2)); X.lineTo(W, H); X.closePath(); X.fillStyle = c; X.fill(); }
function moonD(x, y, r, phase = 1) { glow(x, y, r * 3.2, mix('#3a4a7a', '#fff3c4', K), 0.35 + 0.25 * K); circ(x, y, r, mix('#cfd6e6', '#fff6d5', K)); if (phase < 1) circ(x + r * 0.45, y - r * 0.15, r * 0.9, 'rgba(0,0,0,0)'); circ(x - r * 0.3, y - r * 0.2, r * 0.12, mix('#b8c0d4', '#efe2b5', K)); circ(x + r * 0.25, y + r * 0.3, r * 0.17, mix('#b8c0d4', '#efe2b5', K)); }
function sunD(x, y, r) { glow(x, y, r * 4, mix('#c07040', '#ffd27a', K), 0.4 + 0.3 * K); circ(x, y, r, mix('#e0a070', '#fff0b0', K)); }
function stars(n, seed = 5, ymax = HOR - 300) { const r = rng(seed); for (let i = 0; i < n; i++) { const x = r() * W, y = r() * ymax, s = 1.5 + r() * 3, tw = 0.5 + 0.5 * Math.sin(TT * 2 + i); circ(x, y, s * (0.7 + 0.3 * tw), `rgba(255,${240 + 15 * K | 0},${200 + 55 * (1 - K) | 0},${0.4 + 0.6 * tw})`); } }
function starD(x, y, r, c = '#ffd54f') { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); } glow(x, y, r * 2.5, mix('#555577', c, K), 0.3 + 0.4 * K); poly(pts, mix('#8890a8', c, K)); }
function cloud(x, y, s, c = '#90caf9') { const cc = mix('#2a2f44', c, K); [[0, 0, 1], [-0.9, 0.25, 0.7], [0.9, 0.25, 0.75], [0.45, -0.35, 0.65], [-0.45, -0.3, 0.6]].forEach(([dx, dy, r]) => circ(x + dx * s, y + dy * s, r * s, cc)); }
function birdD(x, y, s, c = '#263238') { const fl = Math.sin(TT * 8 + x) * 0.5; limb([[x - s, y - s * fl], [x - s * 0.3, y], [x, y + s * 0.15], [x + s * 0.3, y], [x + s, y - s * fl]], s * 0.18, col(c)); }
function hut(x, y, s) { poly([[x - s, y], [x + s, y], [x + s, y - s * 0.9], [x - s, y - s * 0.9]], col('#a1887f')); poly([[x - s * 1.25, y - s * 0.85], [x, y - s * 1.7], [x + s * 1.25, y - s * 0.85]], col('#795548')); poly([[x - s * 0.2, y], [x + s * 0.2, y], [x + s * 0.2, y - s * 0.55], [x - s * 0.2, y - s * 0.55]], col('#3e2723')); if (K > 0.3) { poly([[x + s * 0.45, y - s * 0.45], [x + s * 0.75, y - s * 0.45], [x + s * 0.75, y - s * 0.7], [x + s * 0.45, y - s * 0.7]], mix('#000000', '#ffd54f', K)); } }
function school(x, y, s) { poly([[x - s, y], [x + s, y], [x + s, y - s * 0.8], [x - s, y - s * 0.8]], col('#ef9a9a')); poly([[x - s * 1.1, y - s * 0.78], [x, y - s * 1.25], [x + s * 1.1, y - s * 0.78]], col('#c62828'));
  for (let i = -2; i <= 2; i++) if (i) poly([[x + i * s * 0.32 - s * 0.1, y - s * 0.6], [x + i * s * 0.32 + s * 0.1, y - s * 0.6], [x + i * s * 0.32 + s * 0.1, y - s * 0.35], [x + i * s * 0.32 - s * 0.1, y - s * 0.35]], col('#fff59d'));
  poly([[x - s * 0.15, y], [x + s * 0.15, y], [x + s * 0.15, y - s * 0.45], [x - s * 0.15, y - s * 0.45]], col('#5d4037')); limb([[x, y - s * 1.25], [x, y - s * 1.6]], 5, col('#6d4c41')); poly([[x, y - s * 1.6], [x + s * 0.3, y - s * 1.5], [x, y - s * 1.4]], col('#ff9800')); }
function city(y, seed = 9) { const r = rng(seed); let x = -20; while (x < W) { const w = 60 + r() * 90, h = 150 + r() * 330; poly([[x, y], [x + w, y], [x + w, y - h], [x, y - h]], col(['#5c6bc0', '#7e57c2', '#26a69a', '#8d6e63'][(r() * 4) | 0]));
    for (let yy = y - h + 20; yy < y - 20; yy += 36) for (let xx = x + 12; xx < x + w - 14; xx += 26) if (r() > 0.45) poly([[xx, yy], [xx + 12, yy], [xx + 12, yy + 18], [xx, yy + 18]], mix('#111118', '#ffe082', K * 0.9)); x += w + 6; } }
