# K2 Vizag – YouTube upload queue
# Add a video = add a block under "videos". Uploaded ones are recorded in
# uploaded.json and never uploaded twice. Set "skip: true" to hold a video.

settings:
  mode: schedule          # schedule = upload now, YouTube publishes it at the time below
                          # direct   = publish immediately with "privacy" below
  publish_time: "18:00"   # daily publish time
  timezone: Asia/Kolkata
  publish_per_day: 1      # videos going public per day (3 h apart if more than 1)
  uploads_per_run: 6      # YouTube API allows ~6 uploads per day

defaults:                 # used for every video unless the video sets its own
  privacy: public
  category: 10            # 10 = Music, 22 = People & Blogs, 27 = Education
  language: te
  made_for_kids: false
  tags: [telugu, telugu songs, telugu lyrics, lyrics video, shorts]
  description: |
    Like 👍 Share 🔁 Subscribe 🔔 for more!
    #k2vizag #shorts

