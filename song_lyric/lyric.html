<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:PM;src:url(fonts/PermanentMarker.woff2)}
@font-face{font-family:CV;src:url(fonts/Caveat.woff2)}
@font-face{font-family:BB;src:url(fonts/BebasNeue.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f1e6d0}
*{box-sizing:border-box}
.abs{position:absolute}
/* scrapbook paper */
#paper{position:absolute;inset:0;background:
  radial-gradient(ellipse 900px 1300px at 50% 45%, #fbf4e4 0%, #f1e6d0 60%, #e4d3b4 100%)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,90,50,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(120,90,50,.07) 2px,transparent 2px);background-size:60px 60px}
#grain{position:absolute;inset:0;opacity:.35;background:repeating-radial-gradient(circle at 30% 40%,rgba(0,0,0,.025) 0 1px,transparent 1px 3px)}
/* title tape */
.tape{position:absolute;background:rgba(255,255,255,.93);box-shadow:3px 4px 10px rgba(60,40,10,.18);padding:10px 34px 14px;
  clip-path:polygon(0 8%,3% 0,9% 6%,15% 0,22% 5%,30% 0,38% 6%,46% 0,55% 5%,63% 0,72% 6%,80% 0,88% 5%,95% 0,100% 7%,99% 50%,100% 93%,96% 100%,90% 94%,83% 100%,75% 95%,67% 100%,58% 94%,50% 100%,42% 95%,34% 100%,26% 94%,18% 100%,10% 95%,4% 100%,0 92%,1% 50%)}
#title{left:50%;top:150px;transform:translateX(-50%) rotate(-2deg);font-family:PM;font-size:74px;color:#1d1d1d;white-space:nowrap}
#sub{left:50%;top:268px;transform:translateX(-50%) rotate(1.5deg);font-family:CV;font-size:54px;color:#7a4b1e;white-space:nowrap;padding:4px 26px 8px}
/* photo frame (torn white paper) */
#frame{position:absolute;left:50%;top:430px;width:1010px;height:740px;margin-left:-505px;background:#fffdf8;
  box-shadow:0 18px 40px rgba(60,40,10,.28);
  clip-path:polygon(0 2%,4% 0,9% 1.5%,15% 0,21% 1.2%,28% 0,35% 1.6%,42% 0,49% 1.3%,56% 0,63% 1.5%,70% 0,77% 1.2%,84% 0,91% 1.6%,97% 0,100% 2%,99.2% 20%,100% 40%,99.3% 60%,100% 80%,99.4% 98%,96% 100%,89% 98.6%,82% 100%,75% 98.5%,68% 100%,61% 98.7%,54% 100%,47% 98.5%,40% 100%,33% 98.6%,26% 100%,19% 98.5%,12% 100%,5% 98.7%,0 100%,.7% 80%,0 60%,.8% 40%,0 20%)}
#photo{position:absolute;left:24px;top:24px;right:24px;bottom:24px;overflow:hidden;background:#222}
#photo img{position:absolute;width:100%;height:100%;object-fit:cover}
.washi{position:absolute;width:190px;height:52px;opacity:.9;box-shadow:0 2px 6px rgba(0,0,0,.12)}
/* lyrics */
#lyr{position:absolute;left:40px;right:40px;top:1300px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px 16px}
.w{position:relative;font-family:PM;font-size:92px;line-height:1;color:#151515;padding:12px 24px 18px;background:#fff;
  box-shadow:4px 6px 0 rgba(30,20,10,.85);transform-origin:50% 70%;white-space:nowrap}
.w.on{background:#FFE14D}
#next{display:none;position:absolute;left:60px;right:60px;top:1590px;text-align:center;font-family:CV;font-size:62px;color:rgba(90,60,30,.75)}
.dd{position:absolute}
</style></head><body>
<div id="paper"></div><div id="grid"></div><div id="grain"></div>
<div id="doodles"></div>
<div class="tape abs" id="title">CHITTI CHITTI CHEEMA</div>
<div class="tape abs" id="sub">Aakasamlo Oka Tara</div>
<div id="frame"><div id="photo"></div></div>
<div class="washi" id="w1" style="left:60px;top:440px;background:repeating-linear-gradient(45deg,#ff8fa3 0 14px,#ffc2cd 14px 28px);transform:rotate(-28deg)"></div>
<div class="washi" id="w2" style="right:60px;top:1120px;background:repeating-linear-gradient(45deg,#7cc6fe 0 14px,#c9e8ff 14px 28px);transform:rotate(-24deg)"></div>
<div id="lyr"></div>
<div id="next"></div>
<script>
const D = window.__DATA__;
const $ = id => document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOut=x=>1-Math.pow(1-clamp(x),3);
const eBack=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// doodles (simple hand-drawn style SVG)
const DO={
 saturn:'<svg viewBox="0 0 120 120" width="150"><circle cx="60" cy="60" r="30" fill="#ffb347" stroke="#222" stroke-width="4"/><ellipse cx="60" cy="62" rx="56" ry="14" fill="none" stroke="#222" stroke-width="4" transform="rotate(-18 60 62)"/><path d="M42 50 q10 -8 22 -4" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>',
 rocket:'<svg viewBox="0 0 120 120" width="140"><path d="M60 8 C84 30 86 64 76 88 H44 C34 64 36 30 60 8Z" fill="#fff" stroke="#222" stroke-width="4"/><circle cx="60" cy="46" r="10" fill="#7cc6fe" stroke="#222" stroke-width="4"/><path d="M44 74 L28 96 L46 90 M76 74 L92 96 L74 90" fill="#ff5d73" stroke="#222" stroke-width="4" stroke-linejoin="round"/><path d="M50 90 Q60 116 70 90" fill="#ffb347" stroke="#222" stroke-width="4"/></svg>',
 star:'<svg viewBox="0 0 60 60" width="64"><path d="M30 4 L37 23 L57 24 L41 36 L47 56 L30 44 L13 56 L19 36 L3 24 L23 23Z" fill="#FFE14D" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/></svg>',
 note:'<svg viewBox="0 0 60 80" width="70"><path d="M22 60 V14 L52 6 V50" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/><ellipse cx="15" cy="62" rx="11" ry="8" fill="#222"/><ellipse cx="45" cy="54" rx="11" ry="8" fill="#222"/></svg>',
 plane:'<svg viewBox="0 0 120 80" width="150"><path d="M4 40 L116 6 L70 74 L56 48Z" fill="#fff" stroke="#222" stroke-width="4" stroke-linejoin="round"/><path d="M56 48 L116 6" stroke="#222" stroke-width="3"/><path d="M4 40 q-30 10 -60 0" stroke="#222" stroke-width="3" stroke-dasharray="8 8" fill="none"/></svg>',
 planet:'<svg viewBox="0 0 80 80" width="96"><circle cx="40" cy="40" r="30" fill="#7cc6fe" stroke="#222" stroke-width="4"/><path d="M20 30 q20 10 40 0 M18 46 q22 12 44 0" stroke="#fff" stroke-width="4" fill="none"/></svg>',
 heart:'<svg viewBox="0 0 60 56" width="62"><path d="M30 52 C8 36 2 24 8 14 C14 4 26 6 30 16 C34 6 46 4 52 14 C58 24 52 36 30 52Z" fill="#ff5d73" stroke="#222" stroke-width="3.5"/></svg>',
};
const DOOD=[['saturn',820,330,1.0],['rocket',30,1150,0.85],['star',960,1210,0.9],['star',110,360,0.8],['note',960,1600,1],['plane',60,1560,0.9],
            ['planet',880,1780,0.8],['heart',150,1820,1],['star',520,1830,0.7],['note',40,700,0.8]];
const dEls=DOOD.map(([k,x,y,s])=>{const e=document.createElement('div');e.className='dd';e.style.left=x+'px';e.style.top=y+'px';e.innerHTML=DO[k];e.dataset.s=s;$('doodles').appendChild(e);return e});
// photos
const imgs=D.stills.map(s=>{const i=new Image();i.src=s.img;i.style.opacity=0;$('photo').appendChild(i);return i});
// lyric lines
let curLine=-1, wEls=[];
function buildLine(i){
  $('lyr').innerHTML='';wEls=[];
  if(i<0) return;
  const L=D.lines[i];
  L.words.forEach((w,j)=>{const e=document.createElement('div');e.className='w';e.textContent=w.t;
    const r=((i*7+j*13)%9-4)*0.9;e.dataset.r=r;$('lyr').appendChild(e);wEls.push(e)});
  // fit: shrink font if the line wraps to more than 2 rows
  let fs=92; const box=$('lyr');
  while(box.scrollHeight>2*(fs+48) && fs>56){fs-=6; wEls.forEach(e=>e.style.fontSize=fs+'px')}
  $('next').textContent = D.lines[i+1] ? D.lines[i+1].words.map(w=>w.t).join(' ') : '';
}
function render(t){
  // doodles float
  dEls.forEach((e,i)=>{const s=+e.dataset.s;e.style.transform=`translateY(${Math.sin(t*1.3+i)*10}px) rotate(${Math.sin(t*.8+i*1.7)*8}deg) scale(${s})`});
  // still
  let k=0; for(let i=0;i<D.stills.length;i++) if(t>=D.stills[i].a) k=i;
  const S=D.stills[k], lt=t-S.a, dur=(D.stills[k+1]?D.stills[k+1].a:D.total)-S.a;
  // frame takes the photo's own shape -> the whole photo is visible (centre of the frame stays at y=800)
  const IW=962, ih=Math.round(IW/(S.ar||1.6)), FH=ih+48;
  const CY=860; $('frame').style.height=FH+'px'; $('frame').style.top=(CY-FH/2)+'px';
  $('lyr').style.top=(CY+FH/2+90)+'px';   // lyrics sit just under the photo
  $('w1').style.top=(CY-FH/2-30)+'px'; $('w2').style.top=(CY+FH/2-34)+'px';
  imgs.forEach((im,i)=>{
    if(i===k){const p=clamp(lt/dur);const z=1.0+0.03*p;
      im.style.opacity=clamp(lt/0.18);
      im.style.transform=`scale(${z})`;}   /* gentle zoom only, no pan: keeps the edges in frame */
    else if(i===k-1){im.style.opacity=clamp(1-lt/0.18);} else im.style.opacity=0;
  });
  const pop=eBack(lt/0.35), rot=[-2.2,1.8,-1.4,2.4][k%4];
  $('frame').style.transform=`rotate(${rot*(0.6+0.4*pop)}deg) scale(${0.94+0.06*pop})`;
  // lyrics
  let li=-1; for(let i=0;i<D.lines.length;i++) if(t>=D.lines[i].a) li=i;
  if(li!==curLine){curLine=li;buildLine(li);}
  if(li>=0){const L=D.lines[li];
    wEls.forEach((e,j)=>{const w=L.words[j];const x=(t-w.a)/0.22;
      e.style.opacity=clamp(x*3); e.style.transform=`rotate(${e.dataset.r}deg) scale(${x<=0?0.4:0.4+0.6*eBack(x)})`;
      const nxt=L.words[j+1]?L.words[j+1].a:L.b; e.classList.toggle('on', t>=w.a && t<nxt);});
    $('next').style.opacity=clamp((t-L.a)/0.4)*0.9;}
  // title subtle bob
  $('title').style.transform=`translateX(-50%) rotate(${-2+Math.sin(t*1.1)*0.6}deg)`;
  // fade from / to black at the ends
  document.body.style.filter=`brightness(${Math.min(clamp(t/0.4),clamp((D.total-t)/0.6))})`;
}
window.render=render;
window.__ready=Promise.all([document.fonts.ready,...imgs.map(i=>i.decode().catch(()=>0))]).then(()=>true);
</script></body></html>
