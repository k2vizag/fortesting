function crown(x, y, s, col = C.y) { return [S(P([[x - s, y], [x - s, y - s * 0.9], [x - s * 0.5, y - s * 0.4], [x, y - s * 1.1], [x + s * 0.5, y - s * 0.4], [x + s, y - s * 0.9], [x + s, y], [x - s, y]]), col, 6)]; }
function castle(x, y, s, col = C.w) { const w = s, h = s * 0.8; const st = [];

  st.push(S(P([[x - w * 0.18, y], [x - w * 0.18, y - h * 0.4], [x, y - h * 0.52], [x + w * 0.18, y - h * 0.4], [x + w * 0.18, y]]), col, 6));
  st.push(S(L(x, y - h - 30, x, y - h - 120), col, 5)); st.push(S(P([[x, y - h - 120], [x + 70, y - h - 100], [x, y - h - 80]]), C.r, 6)); return st; }
function sword(x1, y1, x2, y2, col = C.b) { const a = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(a) * 26, ny = Math.cos(a) * 26, gx = x1 + (x2 - x1) * 0.18, gy = y1 + (y2 - y1) * 0.18;
  return [S(L(x1, y1, x2, y2), col, 8), S(L(gx - nx, gy - ny, gx + nx, gy + ny), C.o, 8)]; }
function shield(x, y, s, col = C.o) { return [S(P([[x - s, y - s], [x + s, y - s], [x + s, y], [x, y + s * 1.2], [x - s, y], [x - s, y - s]]), col, 7), S(L(x, y - s, x, y + s * 1.1), col, 4), S(L(x - s, y - s * 0.35, x + s, y - s * 0.35), col, 4)]; }
function halo(x, y, r, col = C.y) { const st = [S(E(x, y, r, r * 0.3), col, 6)]; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; st.push(S(L(x + Math.cos(a) * (r + 30), y + 40 + Math.sin(a) * (r + 30), x + Math.cos(a) * (r + 80), y + 40 + Math.sin(a) * (r + 80)), col, 4)); } return st; }

function cloud(x, y, s, col = C.w, w = 6) { return [S(B([x - s, y], [x - s * 1.3, y - s * 0.7], [x - s * 0.3, y - s * 0.9], [x - s * 0.2, y - s * 0.4]), col, w), S(B([x - s * 0.25, y - s * 0.5], [x, y - s * 1.2], [x + s * 0.9, y - s * 1.0], [x + s * 0.6, y - s * 0.3]), col, w), S(B([x + s * 0.6, y - s * 0.35], [x + s * 1.3, y - s * 0.4], [x + s * 1.2, y + s * 0.2], [x + s * 0.7, y]), col, w), S(L(x - s, y, x + s * 0.7, y), col, w)]; }
function bolt(x, y, s, col = C.y) { return [S(P([[x, y], [x - s * 0.4, y + s], [x, y + s], [x - s * 0.3, y + s * 2]]), col, 7)]; }
